name = "myring-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Comma-separated list of allowed browser origins.
ALLOWED_ORIGINS = "https://tojen.github.io,http://localhost:5173"
# Model used for the assessment engine.
MODEL = "claude-fable-5-1"

# Secrets (set with `npx wrangler secret put ANTHROPIC_API_KEY`):
#   ANTHROPIC_API_KEY
